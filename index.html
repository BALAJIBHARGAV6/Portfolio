    <!--
      Theme-aware favicon swapper.
      Runs immediately (before paint) and also watches <html data-theme="...">
      for changes, so flipping the site's theme toggle updates the tab icon too.
      Dark theme  -> green "BB" on black
      Light theme -> amber "BB" on dark-cream, to match the light-mode accent
    -->
    <script>
      (function () {
        var DARK_ICON =
          "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230A0A0A'/%3E%3Ctext x='32' y='42' font-family='monospace' font-size='26' font-weight='700' fill='%2339FF14' text-anchor='middle'%3EBB%3C/text%3E%3C/svg%3E";
        var LIGHT_ICON =
          "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23FBF6E9'/%3E%3Ctext x='32' y='42' font-family='monospace' font-size='26' font-weight='700' fill='%23E0A812' text-anchor='middle'%3EBB%3C/text%3E%3C/svg%3E";

        function applyFavicon() {
          var theme = document.documentElement.getAttribute("data-theme");
          var link = document.getElementById("favicon");
          if (!link) return;
          link.setAttribute("href", theme === "light" ? LIGHT_ICON : DARK_ICON);
        }

        applyFavicon();

        var observer = new MutationObserver(applyFavicon);
        observer.observe(document.documentElement, {
          attributes: true,
          attributeFilter: ["data-theme"]
        });
      })();
    </script>
